[project]
name = "gym-pilates"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "SQLAlchemy>=2.0.0",
    "Werkzeug>=3.0.0",
    "python-dateutil>=2.8.0",
    "pg8000>=1.31.0",
    "scramp>=1.4.5"
]

[tool.vercel]
entrypoint = "run:app"
